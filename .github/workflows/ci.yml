name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · three-verdict self-test · dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + self-test (VULNERABLE / NO_LEAK_DETECTED / INCONCLUSIVE)
        run: npm test

      - name: Dashboard build
        working-directory: web
        run: |
          npm ci
          npm run build
